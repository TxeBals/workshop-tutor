[project]
name = "forja"
version = "1.0.0"
description = "Workshop: build your own coding agent (like Claude Code / OpenCode) with local open models"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",       # only as an OpenAI-compatible HTTP client (Ollama, vLLM, LM Studio, OpenRouter)
  "httpx>=0.27",
  "pydantic>=2.7",
  "rich>=13",
  "pyyaml>=6",
  "mcp>=1.2",           # compatible with 1.x and 2.x
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forja = "forja.cli:main"

[tool.setuptools]
packages = ["forja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
